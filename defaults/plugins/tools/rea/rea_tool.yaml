name: incident_sample_reverse
description: REA/Ghidra 恶意样本深度静态逆向。仅处理当前应急事件已取证的PE/ELF，由AI选择实际函数反编译和引用追查，返回排队状态、报告与证据。analyze后使用result查询。不会运行样本。
category: custom
enabled: true
requires_confirmation: false
inputSchema:
  type: object
  additionalProperties: false
  properties:
    action:
      type: string
      enum: [environment, analyze, result, evidence]
    case_id:
      type: string
      description: 真实应急事件ID，除environment外必填。
    sample_evidence_id:
      type: string
      description: 本事件已取证样本ID，analyze必填。
    evidence_id:
      type: string
      description: 本事件实际REA证据ID，evidence操作必填。
  required: [action]
handler:
  type: script
  script_file: rea_tool.py
  function: investigate

